name: Build Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du moteur et des 2000 niveaux
        run: node tools/test.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: SDK Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Clé de signature (si configurée dans les secrets)
        env:
          KEYSTORE_B64: ${{ secrets.CANDYNOVA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            echo "CANDYNOVA_KEYSTORE=release.jks" >> "$GITHUB_ENV"
            echo "Signature release activée"
          else
            echo "Pas de clé : l'AAB release ne sera pas signé"
          fi

      - name: Compilation
        env:
          CANDYNOVA_KEYSTORE_PASSWORD: ${{ secrets.CANDYNOVA_KEYSTORE_PASSWORD }}
          CANDYNOVA_KEY_ALIAS: ${{ secrets.CANDYNOVA_KEY_ALIAS }}
          CANDYNOVA_KEY_PASSWORD: ${{ secrets.CANDYNOVA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: APK de test (à installer sur le téléphone)
        uses: actions/upload-artifact@v4
        with:
          name: CandyNova-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: AAB pour le Play Store
        uses: actions/upload-artifact@v4
        with:
          name: CandyNova-release-aab
          path: app/build/outputs/bundle/release/*.aab
